name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'iran_stock_signal_android_v113_watchlist_toast_persian_dates.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf source
          unzip -q iran_stock_signal_android_v113_watchlist_toast_persian_dates.zip -d source
          test -f source/settings.gradle || test -f source/settings.gradle.kts
          test -f source/app/build.gradle || test -f source/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find and configure Android SDK
        shell: bash
        run: |
          set -e

          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK: $SDKROOT"

          SDKMANAGER=""

          for candidate in \
            "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDKROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDKROOT/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDKROOT/tools/bin/sdkmanager"; do

            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDKROOT" -type f -name sdkmanager -perm -111 -print -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDKROOT" -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          SDK_BIN="$(dirname "$SDKMANAGER")"

          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-signal-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
