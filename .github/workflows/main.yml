name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'iran_stock_signal_android_v89_sdk_path_fix.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf source
          unzip -q iran_stock_signal_android_v89_sdk_path_fix.zip -d source
          find source -maxdepth 2 -type f | head -30

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-signal-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
